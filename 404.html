<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ページが見つかりません｜マエデン（秩父市の電気工事・水まわりリフォーム）</title>
<meta name="robots" content="noindex,follow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1B3A57">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="%231B3A57"/><path d="M18 5 9 18h6l-2 9 10-14h-6l1-8z" fill="%23F2A81D"/></svg>'>
<style>
:root{
  --paper:#F6F3EA;--ink:#1B3A57;--ink-soft:#43607C;--accent:#C63B22;--spark:#F2A81D;
  --line:rgba(27,58,87,.16);--grid:rgba(27,58,87,.055);--grid-strong:rgba(27,58,87,.10);
  --jp:"Zen Kaku Gothic New",-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --min:"Hiragino Mincho ProN",serif;
  --mono:"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#132B44;--ink:#D9E7F4;--ink-soft:#95B0CC;--accent:#E4593B;--spark:#F5B440;
  --line:rgba(217,231,244,.2);--grid:rgba(217,231,244,.05);--grid-strong:rgba(217,231,244,.1)}
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--jp);color:var(--ink);background:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px),
    linear-gradient(var(--grid-strong) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-strong) 1px,transparent 1px);
  background-size:26px 26px,26px 26px,130px 130px,130px 130px;
  line-height:1.9;letter-spacing:.02em;-webkit-font-smoothing:antialiased;
  min-height:100svh;display:flex;align-items:center;justify-content:center;padding:28px;
}
a{color:inherit;text-decoration:none}
.box{max-width:640px;width:100%;text-align:center}
.brand{display:inline-flex;align-items:center;gap:11px;margin-bottom:40px}
.brand svg{width:40px;height:40px;color:var(--ink);display:block}
.brand b{font-weight:900;font-size:21px;letter-spacing:.06em;line-height:1.1;display:block}
.brand span{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--ink-soft)}
.code{font-family:var(--mono);font-size:11.5px;letter-spacing:.26em;color:var(--ink-soft);
  display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:18px}
.code::before,.code::after{content:"";width:38px;height:1px;background:var(--ink-soft)}
h1{font-family:var(--min);font-weight:800;font-size:clamp(24px,4.6vw,34px);
  line-height:1.45;letter-spacing:.04em;margin-bottom:18px}
p{font-size:14.5px;color:var(--ink-soft);font-weight:500;margin-bottom:34px}
.cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn-tel{
  display:flex;flex-direction:column;justify-content:center;background:var(--accent);color:#fff;
  padding:13px 28px;border:1.5px solid var(--accent);box-shadow:5px 5px 0 rgba(27,58,87,.85);
  transition:transform .18s,box-shadow .18s;
}
.btn-tel:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(27,58,87,.85)}
.btn-tel .t{font-size:10.5px;letter-spacing:.16em;font-weight:700;opacity:.92}
.btn-tel .n{font-weight:900;font-size:24px;letter-spacing:.03em;line-height:1.25}
.btn-ghost{
  display:flex;align-items:center;gap:10px;border:1.5px solid var(--ink);padding:13px 26px;
  font-weight:700;font-size:14px;letter-spacing:.06em;transition:background .22s,color .22s;
}
.btn-ghost:hover{background:var(--ink);color:var(--paper)}
.btn-ghost::before{content:"←";font-family:var(--mono)}
.note{margin-top:30px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink-soft)}
@media (max-width:480px){.btn-tel,.btn-ghost{width:100%;justify-content:center;text-align:center}}
</style>
</head>
<body>
<div class="box">
  <a class="brand" href="/" aria-label="マエデン トップへ">
    <svg viewBox="0 0 44 44" aria-hidden="true">
      <rect x="2" y="2" width="40" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <path d="M9 32 L18 18 L24 26 L31 12 L36 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M25 8 l-4.5 7 h3.4 l-1.6 6 5.4-7.6 h-3.4 z" fill="#F2A81D"/>
    </svg>
    <span>
      <b>マエデン</b>
      <span>MAEDEN｜CHICHIBU, SAITAMA</span>
    </span>
  </a>

  <p class="code">404 — PAGE NOT FOUND</p>
  <h1>お探しのページが<br>見つかりませんでした。</h1>
  <p>
    ページが移動または削除された可能性があります。<br>
    お急ぎの場合は、お電話でお気軽にご相談ください。
  </p>

  <div class="cta">
    <a class="btn-tel" href="tel:0494251126">
      <span class="t">お電話でのご相談</span>
      <span class="n">0494-25-1126</span>
    </a>
    <a class="btn-ghost" href="/">トップページへ戻る</a>
  </div>

  <p class="note">営業時間 9:00–17:00（日曜定休） ／ 現地調査・お見積り無料</p>
</div>
</body>
</html>
